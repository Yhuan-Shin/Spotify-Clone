<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-black text-white font-sans"> 
    <div class="main-container">
        <div class="navbar bg-black flex items-center p-4">
            <div class="nav-links flex gap-5 w-full items-center justify-start">
                <div class="logo">
                    <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2023/05/Spotify_Primary_Logo_RGB_White.png" alt="Spotify-Logo" class="logo-img" height="30px" width="30px">
                </div>
                <div class="home">
                    <img src="https://img.icons8.com/fluency-systems-filled/48/FFFFFF/home.png" alt="home-icon"  height="40px" width="40px" class="bg-neutral-800 rounded-full p-2" />
                </div>

                <div class="search">
                    <input type="text" placeholder=" What do you want to play?" class="search-input bg-neutral-800 text-white p-2 w-100 rounded-full" />
                </div>
            </div>
            <div class="nav-links flex w-full  items-center justify-center  gap-4 font-semibold p-2">
                <a href="#" class="text-gray-300">Premium Support Download</a>
                <a href="#" class="text-gray-300">Install App</a>
                <a href="#" class="text-gray-300">Sign Up</a>
                <button class="bg-white text-black rounded-full px-4 py-2">Log In</button>
            </div>
        </div>

        <div class="main-content-container justify-center w-full flex gap-4 p-2">
            <div class="sidebar bg-neutral-900 justify-start p-4 rounded-md ">
                <p class="p-2 font-semibold gap-4">Your Library</p>
                <div class="card1 p-5 w-100 bg-neutral-800 rounded-lg flex flex-col gap-4">
                    <p class="font-semibold">Create your first playlist</p>
                    <p>It's easy, we'll help you</p>
                    <button class="bg-white text-black w-50 rounded-full px-4 p-2 font-semibold">Create Playlist</button>
                </div>
                <div class="card2 p-5 w-100 bg-neutral-800 rounded-lg flex flex-col gap-4 mt-4">
                    <p class="font-semibold">Let me find some podcasts to follow</p>
                    <p>We'll keep you updated on new episodes</p>
                    <button class="bg-white text-black w-50 rounded-full px-4 p-2 font-semibold">Discover</button>

                </div>

                <div class="footer p-5 w-100 rounded-lg flex flex-col gap-4 flex justify-end mt-50">
                    <div class="col flex flex-row whitespace-nowrap text-sm gap-4">
                        <p class="text-gray-500">Legal</p>
                        <p class="text-gray-500">Safety&Privacy Center</p>
                        <p class="text-gray-500">Privacy Policy</p>
                        <p class="text-gray-500">Cookies</p>
                    </div>
                    <div class="col flex flex-row whitespace-nowrap text-sm gap-4 mt-2">
                        <p class="text-gray-500">About Ads</p>
                        <p class="text-gray-500">Accessibility</p>
                    </div>
                    <p class="text-white font-semibold text-sm">Cookies</p>
                    <button class="p-2 border w-30 text-md font-semibold rounded-full" >English</button>
                </div>
            </div>
            <div class="content bg-neutral-900 w-full rounded-md">

            </div>
        </div>
    </div>
</body>
</html>
